<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="面向有机合成实验的移动端化学浓度计算器：输入摩尔质量与 c/V/m 中任意两项，即可求出第三项，支持离线使用。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f0f4f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="浓度计算器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
<title>化学浓度计算器</title>
<script>
/* 首屏防闪：在样式生效前确定主题（与 app.js 的规则保持一致） */
(function () {
  try {
    var stored = localStorage.getItem('chemcalc_theme');
    var dark = stored === 'dark' ||
      ((stored === null || stored === 'auto') &&
        window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f0f4f8');
  } catch (e) { /* 隐私模式下 localStorage 不可用，保持默认浅色 */ }
})();
</script>
</head>
<body>

<div class="wallpaper" id="wallpaper" aria-hidden="true"></div>

<div class="app">
  <header class="header">
    <div class="title-wrap">
      <h1>浓度计算器</h1>
      <span class="app-version">v1.3.5</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-settings" type="button" title="设置" aria-label="设置">⚙︎</button>
    </div>
  </header>

  <div class="card" id="input-card">

    <div class="input-group input-molar" data-field="M">
      <input type="text" inputmode="none" readonly id="input-molar" data-field="M" placeholder="输入摩尔质量">
      <div class="field-side">
        <label for="input-molar">摩尔质量 <em>M</em></label>
        <span class="known-badge">已知量</span>
      </div>
    </div>

    <div class="input-group" data-field="c">
      <input type="text" inputmode="none" readonly id="input-c" data-field="c" placeholder="0">
      <div class="field-side">
        <label for="input-c">浓度 <em>c</em></label>
        <div class="segmented" data-unit-field="c">
          <div class="seg-slider"></div>
          <button class="seg-option" type="button" data-unit="M">M</button>
          <button class="seg-option active" type="button" data-unit="mM">mM</button>
          <button class="seg-option" type="button" data-unit="μM">μM</button>
        </div>
      </div>
    </div>

    <div class="input-group" data-field="V">
      <input type="text" inputmode="none" readonly id="input-v" data-field="V" placeholder="0">
      <div class="field-side">
        <label for="input-v">体积 <em>V</em></label>
        <div class="segmented" data-unit-field="V">
          <div class="seg-slider"></div>
          <button class="seg-option" type="button" data-unit="L">L</button>
          <button class="seg-option active" type="button" data-unit="mL">mL</button>
        </div>
      </div>
      <div class="pipette-hint" id="pipette-hint"></div>
    </div>

    <div class="input-group" data-field="m">
      <input type="text" inputmode="none" readonly id="input-m" data-field="m" placeholder="0">
      <div class="field-side">
        <label for="input-m">质量 <em>m</em></label>
        <div class="segmented" data-unit-field="m">
          <div class="seg-slider"></div>
          <button class="seg-option" type="button" data-unit="g">g</button>
          <button class="seg-option active" type="button" data-unit="mg">mg</button>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-calc" id="btn-calc" type="button">计算</button>
      <button class="btn-save" id="btn-save" type="button">保存</button>
    </div>

  </div>

  <div class="keypad-wrap">
    <div class="keypad-hint" id="keypad-hint" role="status" aria-live="polite">请先输入摩尔质量 M（化合物固定值）</div>
    <div class="keypad" id="keypad">
      <button class="key-clear" type="button" data-key="clear">清 零</button>
      <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
      <button type="button" data-key=".">.</button><button type="button" data-key="0">0</button>
      <button class="key-del" type="button" data-key="backspace" aria-label="退格">⌫</button>
    </div>
  </div>
</div>

<div class="modal" id="history-modal">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="history-title" tabindex="-1">
    <div class="modal-header">
      <h3 class="modal-title" id="history-title">计算记录</h3>
      <div class="modal-actions">
        <button class="modal-clear" id="btn-clear-history" type="button">清空</button>
        <button class="icon-btn modal-close" id="btn-close-history" type="button" aria-label="关闭">✕</button>
      </div>
    </div>
    <div class="history-list" id="history-list" aria-label="计算记录"></div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
    <div class="modal-header">
      <h3 class="modal-title" id="settings-title">设置</h3>
      <button class="icon-btn modal-close" id="btn-close-settings" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="settings-list">
      <button class="settings-item" id="settings-history" type="button">
        <span class="settings-icon">▤</span>
        <span class="settings-text"><strong>计算记录</strong><small id="settings-history-count">暂无记录</small></span>
        <span class="settings-arrow">›</span>
      </button>
      <div class="settings-item settings-skin">
        <button class="settings-main" id="settings-skin" type="button">
          <span class="settings-icon">👕</span>
          <span class="settings-text"><strong>皮肤 · 壁纸</strong><small id="settings-skin-state">默认背景</small></span>
        </button>
        <button class="settings-clear" id="settings-skin-clear" type="button" hidden>清除</button>
      </div>
      <button class="settings-item" id="settings-theme" type="button">
        <span class="settings-icon" id="settings-theme-icon">◐</span>
        <span class="settings-text"><strong>主题</strong><small id="settings-theme-value">跟随系统</small></span>
        <span class="settings-arrow">›</span>
      </button>
      <button class="settings-item" id="settings-clearall" type="button">
        <span class="settings-icon">↺</span>
        <span class="settings-text"><strong>全部清除</strong><small>清空当前输入的数值</small></span>
      </button>
    </div>
  </div>
</div>

<input type="file" id="wallpaper-input" accept="image/*" hidden>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
